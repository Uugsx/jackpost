info:
  name: dirname-request
  type: http
  seq: 1

http:
  method: GET
  url: '{{host}}/ping'

runtime:
  scripts:
    - type: before-request
      code: |-
        jp.setEnvVar("requestDir", __dirname);
        jp.setEnvVar("requestFile", __filename);
        // fs is only reachable in the developer (node-vm) sandbox, so skip in safe mode.
        if (!jp.isSafeMode()) {
          const fs = require('fs');
          const path = require('path');
          const raw = fs.readFileSync(path.join(__dirname, 'data.json'), 'utf-8');
          jp.setEnvVar("readData", JSON.parse(raw).greeting);
        }
    - type: tests
      code: |-
        test("collection, parent folder, and child folder __dirname are all distinct", function() {
          const collectionDir = jp.getCollectionVar("collectionDir");
          const parentDir = jp.getEnvVar("parentDir");
          const childDir = jp.getEnvVar("childDir");
          expect(collectionDir).to.not.equal(parentDir);
          expect(parentDir).to.not.equal(childDir);
          expect(collectionDir).to.not.equal(childDir);
        });

        test("child folder __dirname is nested under parent folder __dirname", function() {
          const parentDir = jp.getEnvVar("parentDir");
          const childDir = jp.getEnvVar("childDir");
          expect(childDir.startsWith(parentDir)).to.equal(true);
          expect(childDir.length).to.be.greaterThan(parentDir.length);
        });

        test("child folder and request live in the same directory", function() {
          expect(jp.getEnvVar("childDir")).to.equal(jp.getEnvVar("requestDir"));
        });

        test("collection __filename ends with opencollection.yml", function() {
          expect(jp.getCollectionVar("collectionFile").endsWith("opencollection.yml")).to.equal(true);
        });

        test("parent folder __filename ends with folder.yml", function() {
          expect(jp.getEnvVar("parentFile").endsWith("folder.yml")).to.equal(true);
        });

        test("child folder __filename ends with folder.yml but differs from parent", function() {
          const parentFile = jp.getEnvVar("parentFile");
          const childFile = jp.getEnvVar("childFile");
          expect(childFile.endsWith("folder.yml")).to.equal(true);
          expect(childFile).to.not.equal(parentFile);
        });

        test("request __filename ends with dirname-request.yml", function() {
          expect(jp.getEnvVar("requestFile").endsWith("dirname-request.yml")).to.equal(true);
        });

        test("readData is written by the pre-request script only in developer mode", function() {
          // developer (node-vm): fs read succeeded, readData === 'hello'.
          // safe (QuickJS): pre-request skipped the fs read via jp.isSafeMode(), readData stays unset.
          const readData = jp.getEnvVar("readData");
          if (jp.isSafeMode()) {
            expect(readData == null || readData === "").to.equal(true);
          } else {
            expect(readData).to.equal("hello");
          }
        });

        // Cleared after assertions so a developer run's persisted value can't be observed as a safe-mode read on the next iteration.
        jp.deleteEnvVar("readData");
