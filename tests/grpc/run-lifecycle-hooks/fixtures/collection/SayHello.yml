info:
  name: SayHello
  type: grpc
  seq: 1

grpc:
  url: "{{host}}"
  method: /hello.HelloService/SayHello
  methodType: unary
  message:
    - title: message 1
      message: |-
        {
          "greeting": "{{greeting}}"
        }

runtime:
  scripts:
    - type: grpc:before-call-start
      code: |-
        jp.setVar('greeting', 'set-by-hook');
        jp.deleteVar('capturedReply');
    - type: grpc:after-call-end
      code: |-
        test('the hook sees the message the unary call sent', () => {
          expect(jp.grpc.request.messages.count()).to.equal(1);
          expect(jp.grpc.request.messages.get(0).data.greeting).to.equal('set-by-hook');
        });

        jp.setVar('capturedReply', jp.grpc.response.messages.get(0).data.reply);

        // Deleted once the assertion above has read it: the two sandbox modes share this
        // collection, so a value left behind would let the next mode pass without the hook running.
        jp.deleteVar('greeting');
