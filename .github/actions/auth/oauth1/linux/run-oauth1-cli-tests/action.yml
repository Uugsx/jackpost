name: 'Run OAuth1 CLI Tests - Linux'
description: 'Run OAuth1 CLI tests on Linux'
runs:
  using: 'composite'
  steps:
    - name: Run JP format CLI tests
      shell: bash
      run: |
        set -euo pipefail

        JP_CLI="../../../../../../packages/jackpost-cli/bin/jp.js"

        # navigate to JP test collection directory
        cd tests/auth/oauth1/fixtures/collections/jp

        echo "=== JP Format Collection Run ==="
        node $JP_CLI run --env Local --output junit-jp.xml --format junit

    - name: Run YML format CLI tests
      shell: bash
      run: |
        set -euo pipefail

        JP_CLI="../../../../../../packages/jackpost-cli/bin/jp.js"

        # navigate to YML test collection directory
        cd tests/auth/oauth1/fixtures/collections/yml

        echo "=== YML Format Collection Run ==="
        node $JP_CLI run --env Local --output junit-yml.xml --format junit
